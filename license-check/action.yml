name: Check Dependency Licenses
description: Fail the build on a Python dependency whose license the organisation has not approved.

inputs:
  package:
    description: What to install and scan. Defaults to the calling repository. Ignored when `requirements` is set.
    required: false
    default: '.'
  requirements:
    description: >
      Path to a requirements file to install instead of `package`. For a repo
      that ships an image rather than a distribution and so has nothing
      pip-installable of its own.
    required: false
    default: ''
  extras:
    description: Comma-separated extras to install with `package`, e.g. "full,tracing". Empty installs base dependencies only.
    required: false
    default: ''
  policy:
    description: Path to a repo-local policy file, applied in addition to the organisation policy rather than replacing it.
    required: false
    default: ''
  python-version:
    required: false
    default: '3.12'
  uv-version:
    required: false
    default: '0.11.10'
  trivy-version:
    description: >
      An exact release — `v0.70.0` or `0.70.0` — whose checksums are committed
      in `trivy-checksums.txt`. `latest` is refused on purpose.
      Pinned deliberately: Trivy 0.73.0 stopped populating license findings on
      Linux; this action reads per-package licenses instead and is unaffected,
      but a compliance gate should never inherit a scanner upgrade silently.
    required: false
    default: 'v0.70.0'
  diagnostics:
    description: Print what each Trivy scan surface saw. Worth running once when onboarding a repo.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@v7
      with:
        version: ${{ inputs.uv-version }}

    # Trivy comes from its release assets directly rather than through
    # aquasecurity/setup-trivy. That action resolves the tag with a single
    # unauthenticated, un-retried request to github.com and reports any non-200
    # as "unable to find <tag>", so a rate-limited moment arrives looking like a
    # deleted release - one job installed this very version twice and lost the
    # third. An asset URL needs no lookup, and this download retries.
    #
    # The version also names the install directory, which makes an earlier
    # invocation in the same job visible: a repo scanning several requirements
    # files installs Trivy once rather than once per file.
    - name: Work out which Trivy to fetch
      id: trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        TRIVY_OS: ${{ runner.os }}
        TRIVY_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        if ! printf '%s' "${TRIVY_VERSION}" | grep -Eq '^v?[0-9]+[.][0-9]+[.][0-9]+$'; then
          echo "::error::trivy-version must name an exact release, e.g. 'v0.70.0'. Got '${TRIVY_VERSION}'." >&2
          exit 1
        fi
        version="${TRIVY_VERSION#v}"
        case "${TRIVY_OS}-${TRIVY_ARCH}" in
          Linux-X64)   asset='Linux-64bit' ;;
          Linux-ARM64) asset='Linux-ARM64' ;;
          macOS-X64)   asset='macOS-64bit' ;;
          macOS-ARM64) asset='macOS-ARM64' ;;
          *)
            echo "::error::No Trivy release asset is mapped for ${TRIVY_OS}/${TRIVY_ARCH}." >&2
            exit 1
            ;;
        esac
        dir="${RUNNER_TEMP}/trivy-${version}"
        installed=false
        if [ -x "${dir}/trivy" ]; then
          installed=true
        fi
        {
          echo "version=${version}"
          echo "asset=${asset}"
          echo "dir=${dir}"
          echo "download-dir=${RUNNER_TEMP}/trivy-download-${version}"
          echo "key=trivy-tarball-${version}-${TRIVY_OS}-${TRIVY_ARCH}"
          echo "installed=${installed}"
        } >> "${GITHUB_OUTPUT}"

    # The tarball is cached, not the unpacked binary, because the tarball is the
    # thing the committed checksums can vouch for. A cache entry is written by
    # whoever can run a workflow on the repo, so a restored binary trusted on
    # sight would be a scanner an attacker chose - and one that fabricated a
    # clean report would satisfy the completeness check too, by reading the very
    # same dist-info the check counts.
    - name: Restore the Trivy download from the cache
      id: trivy-cache
      if: steps.trivy.outputs.installed != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.trivy.outputs.download-dir }}
        key: ${{ steps.trivy.outputs.key }}

    # --retry-all-errors so a 429 or a 5xx is retried and not only a dropped
    # connection, and --fail so an HTTP error is a failure at all rather than a
    # page of HTML saved as a tarball.
    - name: Download Trivy
      if: steps.trivy.outputs.installed != 'true' && steps.trivy-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.trivy.outputs.version }}
        ASSET: ${{ steps.trivy.outputs.asset }}
        DOWNLOAD_DIR: ${{ steps.trivy.outputs.download-dir }}
      run: |
        set -euo pipefail
        tarball="trivy_${VERSION}_${ASSET}.tar.gz"
        url="https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/${tarball}"
        mkdir -p "${DOWNLOAD_DIR}"
        curl --retry 5 --retry-delay 2 --retry-all-errors --fail --silent --show-error --location --output "${DOWNLOAD_DIR}/${tarball}" "${url}"

    # Runs whether the tarball was downloaded or restored, so there is no path
    # on which a Trivy binary is trusted unverified. The checksums are committed
    # rather than fetched for the same reason: a checksums file pulled from the
    # network alongside the tarball vouches for transit only, and one read from
    # the cache would be chosen by whoever wrote the cache.
    #
    # Unpacked via mktemp and mv so `dir/trivy` either does not exist or is a
    # whole, verified binary - never a half-extracted one that the same-job
    # check above would read as installed.
    - name: Verify and unpack Trivy
      if: steps.trivy.outputs.installed != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.trivy.outputs.version }}
        ASSET: ${{ steps.trivy.outputs.asset }}
        DOWNLOAD_DIR: ${{ steps.trivy.outputs.download-dir }}
        DIR: ${{ steps.trivy.outputs.dir }}
        CHECKSUMS: ${{ github.action_path }}/trivy-checksums.txt
      run: |
        set -euo pipefail
        tarball="trivy_${VERSION}_${ASSET}.tar.gz"
        entry="$(awk -v want="${tarball}" '$2 == want' "${CHECKSUMS}")"
        if [ -z "${entry}" ]; then
          echo "::error::${CHECKSUMS} has no entry for ${tarball}. Changing trivy-version means committing that release's checksums file alongside it - this gate pins its scanner by hash, not only by tag." >&2
          exit 1
        fi
        ( cd "${DOWNLOAD_DIR}" && echo "${entry}" | sha256sum -c - )
        work="$(mktemp -d "${RUNNER_TEMP}/trivy-unpack-XXXXXX")"
        tar -xzf "${DOWNLOAD_DIR}/${tarball}" -C "${work}" trivy
        chmod +x "${work}/trivy"
        mkdir -p "${DIR}"
        mv "${work}/trivy" "${DIR}/trivy"
        rm -rf "${work}"

    # After verification, so a tarball that failed its checksum is never handed
    # on to the next job.
    - name: Save the Trivy download to the cache
      if: steps.trivy.outputs.installed != 'true' && steps.trivy-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.trivy.outputs.download-dir }}
        key: ${{ steps.trivy.outputs.key }}

    - name: Put Trivy on PATH
      if: steps.trivy.outputs.installed != 'true'
      shell: bash
      env:
        DIR: ${{ steps.trivy.outputs.dir }}
      run: echo "${DIR}" >> "${GITHUB_PATH}"

    # Licenses are read from each installed package's site-packages METADATA;
    # a requirements file carries no license data at all. Inputs travel through
    # env rather than `${{ }}` interpolation so nothing in them can be parsed
    # as shell.
    - name: Install the package into a scannable venv
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        REQUIREMENTS: ${{ inputs.requirements }}
        EXTRAS: ${{ inputs.extras }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        # --clear because a repo with more than one requirements file calls this
        # action once per file in the same job, and `uv venv` refuses an existing
        # virtualenv rather than replacing it. Without this the second call fails
        # with "A virtual environment already exists", and the first scan's
        # packages would otherwise leak into the second.
        uv venv --clear "${RUNNER_TEMP}/license-venv" --python "${PYTHON_VERSION}"
        python="${RUNNER_TEMP}/license-venv/bin/python"
        if [ -n "${REQUIREMENTS}" ]; then
          uv pip install --python "${python}" -r "${REQUIREMENTS}"
        elif [ -n "${EXTRAS}" ]; then
          uv pip install --python "${python}" "${PACKAGE}[${EXTRAS}]"
        else
          uv pip install --python "${python}" "${PACKAGE}"
        fi

    # `rootfs`, never `fs`: on the same venv, `trivy fs` returns no result
    # blocks at all while `rootfs` enumerates every package.
    #
    # setuptools bundles a deliberately license-less fixture package in its
    # pkg_resources test data. It is not a dependency, but it carries EGG-INFO
    # and Trivy reads it like any other package, so it arrives as
    # `my-test-package 1.0 is UNKNOWN` and fails a repo that has done nothing
    # wrong. Skipped by path rather than by name so a real package could never
    # be hidden by sharing one.
    - name: Extract dependency licenses
      shell: bash
      run: |
        set -euo pipefail
        trivy rootfs --scanners license --quiet --format json \
          --skip-dirs '**/pkg_resources/tests/**' \
          --output "${RUNNER_TEMP}/licenses.json" "${RUNNER_TEMP}/license-venv"

    - name: Report what each scan surface saw
      if: inputs.diagnostics == 'true'
      shell: bash
      run: |
        set -euo pipefail
        trivy fs --scanners license --quiet --format json \
          --output "${RUNNER_TEMP}/licenses-fs.json" "${RUNNER_TEMP}/license-venv"
        python3 "${GITHUB_ACTION_PATH}/license_diagnostics.py" \
          "${RUNNER_TEMP}/licenses.json" "${RUNNER_TEMP}/licenses-fs.json" \
          "${RUNNER_TEMP}/license-venv"
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}

    - name: Enforce the license policy
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        REPO_POLICY: ${{ inputs.policy }}
      run: |
        set -euo pipefail
        args=(--scan "${RUNNER_TEMP}/licenses.json"
              --venv "${RUNNER_TEMP}/license-venv"
              --policy "${GITHUB_ACTION_PATH}/license-policy.txt")
        if [ -n "${REPO_POLICY}" ]; then
          args+=(--policy "${REPO_POLICY}")
        fi
        python3 "${GITHUB_ACTION_PATH}/check_licenses.py" "${args[@]}"
